[package]
name = "tauri-plugin-notification"
version = "2.4.0"
description = "Send desktop and mobile notifications on your Tauri application."
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-notification"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-linux-android"]

[package.metadata.platforms.support]
windows = { level = "full", notes = "Windows 7-11. Rich adaptive toasts on Win10+. Background COM activation and Notification Listener require MSIX packaging." }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
rand = "0.9"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
url = { version = "2", features = ["serde"] }
serde_repr = "0.1"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { workspace = true, features = ["wry"] }

[target."cfg(windows)".dependencies]
# was optional (windows7-compat only); now always compiled for runtime tier detection
win7-notifications = "0.4.5"
windows-version = "0.1"

# windows-sys for raw COM vtable implementation in com_activator.rs.
# Using windows-sys avoids the proc-macro version conflict that occurs when
# windows-core is pulled in at multiple versions by transitive dependencies.
[target."cfg(windows)".dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Storage_Packaging_Appx",
]

[target."cfg(windows)".dependencies.windows-core]
version = "0.62.2"
features = [

]

[target."cfg(windows)".dependencies.windows]
version = "0.61.2"
features = [
    "UI_Notifications",
    "UI_Notifications_Management",
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "Win32_Storage_Packaging_Appx",
    "Win32_UI_Shell",
    "Win32_System_WinRT",
    "ApplicationModel"
    ]

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\"))".dependencies]
notify-rust = "4.11"

[dev-dependencies]
color-backtrace = "0.7"
ctor = "0.2"
maplit = "1"

[features]
# kept as a no-op shim for backward compat; Win7 support is now always compiled in
windows7-compat = []
